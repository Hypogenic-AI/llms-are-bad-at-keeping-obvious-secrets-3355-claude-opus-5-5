[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "arxiv>=4.0.1",
    "datasets>=5.0.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=3.24.0",
    "pandas>=2.3.3",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
    "torch==2.9.1",
    "transformers>=4.57,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
